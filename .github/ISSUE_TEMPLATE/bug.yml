name: Bug report
description: Report reproducible incorrect behavior without sharing private stream data.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Never post tokens, private hostnames, encryption keys, customer data, or playable media.
  - type: input
    id: version
    attributes:
      label: StreamProbe version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options: [HLS, DASH, Unknown/not protocol-specific]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior and a minimal sanitized manifest if possible.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.12, Windows 11 / Docker 26, Ubuntu 24.04
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, signatures, private hostnames, personal data, and media URLs.
          required: true
